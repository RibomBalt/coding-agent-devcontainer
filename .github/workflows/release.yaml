name: Release features and base image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish Features
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-base-image:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: "ghcr.io/${GITHUB_REPOSITORY,,}-base:${{ github.ref_name }}"
      IMAGE_LATEST: "ghcr.io/${GITHUB_REPOSITORY,,}-base:latest"
      SOURCE_HASH_LABEL: "devcontainer.base-source-hash"
    steps:
      - uses: actions/checkout@v4

      - name: Compute image source hash
        id: src
        run: |
          HASH=$(git ls-files image/ | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if base image source changed
        id: check
        run: |
          if docker manifest inspect "$IMAGE_LATEST" >/dev/null 2>&1; then
            docker pull "$IMAGE_LATEST"
            PREV=$(docker image inspect --format "{{index .Config.Labels \"${SOURCE_HASH_LABEL}\"}}" "$IMAGE_LATEST" 2>/dev/null || true)
            if [ -n "$PREV" ] && [ "$PREV" = "${{ steps.src.outputs.hash }}" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build and push base image
        if: steps.check.outputs.changed == 'true'
        run: |
          docker build -f image/Dockerfile-base \
            --label "${SOURCE_HASH_LABEL}=${{ steps.src.outputs.hash }}" \
            -t "$IMAGE_TAG" -t "$IMAGE_LATEST" image
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Retag latest as release tag
        if: steps.check.outputs.changed == 'false'
        run: |
          docker tag "$IMAGE_LATEST" "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
