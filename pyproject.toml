[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-devcontainer"
version = "0.1.1"
description = "Dev container feature management CLI for the OpenCode sandbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "questionary>=2.0",
    "rich>=13.0",
]

[project.scripts]
coding-agent-devcontainer = "coding_agent_devcontainer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coding_agent_devcontainer*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
